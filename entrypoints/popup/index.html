<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Transbot</title>
  </head>
  <body class="popup">
    <main class="panel">
      <header class="top">
        <div>
          <h1>Transbot</h1>
          <p id="service" class="hint"></p>
        </div>
        <nav class="links">
          <a id="open-translate" href="#">翻译页</a>
          <a id="open-options" href="#">设置</a>
        </nav>
      </header>
      <label class="field">
        <span>原文</span>
        <textarea id="source" rows="6" placeholder="输入或粘贴要翻译的文字"></textarea>
      </label>
      <div class="row">
        <label>
          源语言
          <select id="from"></select>
        </label>
        <label>
          目标语言
          <select id="to"></select>
        </label>
      </div>
      <button id="go" type="button">翻译</button>
      <p id="status" class="status" role="status" hidden></p>
      <section id="result" class="result" hidden></section>
      <p class="hint">划词后自动出译文。关掉自动翻译时，选区旁有「翻译」按钮。快捷键 Alt+Shift+T。翻译服务在设置里选择。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
