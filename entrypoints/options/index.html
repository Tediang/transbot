<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Transbot 设置</title>
  </head>
  <body class="page">
    <main class="sheet">
      <header>
        <h1>Transbot 设置</h1>
        <p class="lead">翻译直接从这台浏览器调用 Azure。密钥只存在本机，不会放进插件包。</p>
      </header>

      <label class="stack">
        Azure Key
        <span class="keyline">
          <input id="key" type="password" autocomplete="off" spellcheck="false" />
          <button id="toggle-key" class="quiet" type="button">显示</button>
        </span>
        <span class="hint">在 Azure 门户打开 Translator 资源的「密钥和终结点」，复制 Key 1。</span>
      </label>

      <label class="stack">
        区域
        <input id="region" type="text" placeholder="全球资源留空，例如 eastasia" autocomplete="off" />
        <span class="hint">全球单服务资源不用填。区域资源或多服务资源要填创建时所在的区域。</span>
      </label>

      <div class="row">
        <label>
          我的语言
          <select id="primary"></select>
        </label>
        <label>
          外语
          <select id="secondary"></select>
        </label>
      </div>
      <p class="hint">选中的文字如果是我的语言，就译成外语；否则译成我的语言。气泡和翻译框里可以临时改。</p>

      <label class="check">
        <input id="selection-enabled" type="checkbox" />
        划词后自动翻译
      </label>
      <p class="hint">关掉之后，选中文字旁边会出现「翻译」按钮。右键菜单和 Alt+Shift+T 不受这个开关影响。</p>

      <details>
        <summary>接口地址</summary>
        <label class="stack">
          <input id="endpoint" type="url" spellcheck="false" />
          <span class="hint">一般保持默认。只接受 Azure Translator 的官方域名。</span>
        </label>
      </details>

      <div class="actions">
        <button id="save" type="button">保存</button>
        <button id="test" class="quiet" type="button">测试连接</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
